<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personality of the Day 🎡</title>
<style>
:root{
  --bg:#090b12; --panel:#111522; --accent:#8ed8ff; --accent2:#c6f0ff;
  --text:#f4f8ff; --muted:#9ba8b8;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,system-ui,Segoe UI,sans-serif;
  color:var(--text); background:
  radial-gradient(circle at 50% 10%, #17304a 0%, transparent 35%),
  radial-gradient(circle at 10% 90%, #17172c 0%, transparent 30%), var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.app{width:min(1100px,100%); display:grid; grid-template-columns:1fr 360px; gap:28px; align-items:center}
.card{
  background:linear-gradient(145deg,rgba(20,25,38,.94),rgba(10,13,22,.94));
  border:1px solid rgba(142,216,255,.18); border-radius:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.45); padding:26px;
  backdrop-filter:blur(12px);
}
h1{margin:0 0 5px;font-size:clamp(28px,4vw,44px)}
.sub{color:var(--muted);margin:0 0 22px}
.wheelWrap{position:relative;width:min(650px,88vw);aspect-ratio:1;margin:auto}
canvas{width:100%;height:100%;display:block}
.pointer{
  position:absolute; top:-3px; left:50%; transform:translateX(-50%);
  width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;
  border-top:0;border-bottom:38px solid #fff; filter:drop-shadow(0 3px 8px #000);
  z-index:3;
}
.spin{
  display:block;margin:20px auto 0; border:0; border-radius:999px; padding:15px 42px;
  font-size:18px;font-weight:800;color:#071018; background:linear-gradient(135deg,var(--accent2),var(--accent));
  cursor:pointer; box-shadow:0 10px 30px rgba(142,216,255,.22); transition:.15s;
}
.spin:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(142,216,255,.3)}
.spin:disabled{opacity:.5;cursor:not-allowed;transform:none}
.result{text-align:center;margin-top:20px;min-height:92px}
.result .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:2px}
.result h2{margin:5px 0;font-size:30px;color:var(--accent2)}
.result p{margin:0;color:var(--muted)}
.list{max-height:610px;overflow:auto;padding-right:5px}
.person{
  display:flex;gap:10px;align-items:center;padding:9px 10px;margin:4px 0;
  border-radius:12px;background:rgba(255,255,255,.035);color:#dce5ef;font-size:14px
}
.num{color:var(--accent);font-weight:800;width:25px}
@media(max-width:850px){.app{grid-template-columns:1fr}.list{max-height:300px}}
</style>
</head>
<body>
<div class="app">
  <section class="card">
    <h1>🎡 Personality of the Day</h1>
    <p class="sub">Welche Persönlichkeit bekommt heute das Kommando?</p>
    <div class="wheelWrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="900" height="900"></canvas>
    </div>
    <button class="spin" id="spin">DREHEN</button>
    <div style="text-align:center;color:#9ba8b8;margin-top:12px;font-size:13px">
      Spin #<span id="spinCount">0</span> · Bonus bei jedem 10. Spin
    </div>
    <div class="result">
      <div class="label">Heute bist du …</div>
      <h2 id="winner">Noch nicht gedreht</h2>
      <p id="desc">Lass das Rad entscheiden.</p>
    </div>
  </section>

  <aside class="card">
    <h2>Die 30 Persönlichkeiten</h2>
    <p class="sub">Jede Persönlichkeit ist einmal auf dem Rad.</p>
    <div class="list" id="list"></div>
  </aside>
</div>

<script>
const personalities = [
  ["Die Chaotin","Alles gleichzeitig, nichts nach Plan."],
  ["Die Drama Queen","Aus einer Kleinigkeit wird eine Netflix-Serie."],
  ["Die Eiskönigin","Gefühle? Heute leider ausverkauft."],
  ["Die Kuschelmaus","Heute wird jeder gedrückt."],
  ["Die Aggressive","Heute lieber nicht provozieren."],
  ["Die Flirtmaschine","Jeder Blick ist eine Einladung."],
  ["Die Gamerin","Real Life hat heute Wartungsarbeiten."],
  ["Die Schlafmütze","Fünf Minuten noch … immer."],
  ["Die Diva","Es muss schon etwas Besonderes sein."],
  ["Die Streitschlichterin","Frieden wird notfalls erzwungen."],
  ["Die Besserwisserin","Sie wusste es natürlich schon vorher."],
  ["Die Verrückte","Vernunft hat heute frei."],
  ["Die Perfektionistin","99 % sind einfach nicht genug."],
  ["Die Abenteuerin","Heute wird irgendwas ausprobiert."],
  ["Die Sarkastische","Natürlich. Genau das hat noch gefehlt."],
  ["Die Süße","Unverschämt lieb und gefährlich harmlos."],
  ["Die Bossin","Heute werden die Entscheidungen getroffen."],
  ["Die Stille","Wenig Worte, maximaler Blick."],
  ["Die Labertasche","Eine Geschichte führt zur nächsten."],
  ["Die Detektivin","Nichts bleibt unentdeckt."],
  ["Die Faulenzerin","Produktivität wurde erfolgreich abgesagt."],
  ["Die Partymaus","Heute wird nicht früh geschlafen."],
  ["Die Romantikerin","Heute ist alles irgendwie süß."],
  ["Die Trollin","Hauptsache jemand verliert die Nerven."],
  ["Die Psychologin","Alle Probleme werden analysiert."],
  ["Die Mutige","Angst? Noch nie gehört."],
  ["Die Eifersüchtige","Wer war das gerade?!"],
  ["Die Glückspilzin","Heute läuft einfach alles."],
  ["Die Böse","Heute gibt es keine Gnade."],
  ["Die Unberechenbare","Niemand weiß, was als Nächstes passiert."]
];

const canvas=document.getElementById("wheel"), ctx=canvas.getContext("2d");
const n=personalities.length, arc=Math.PI*2/n, colors=[];
for(let i=0;i<n;i++) colors.push(`hsl(${190 + (i*137)%150} 70% ${i%2?28:35}%)`);

let rotation=0, spinning=false;
let spinCount=Number(localStorage.getItem("personalitySpinCount")||0);
const bonuses=[
  ["💸 5€-Bonus","Du zahlst 5 € für etwas ihrer Wahl."],
  ["🍕 Essen geht auf dich","Sie darf sich etwas zu essen aussuchen – du zahlst."],
  ["🎁 Wunsch-Geschenk","Sie darf sich eine Kleinigkeit bis 15 € aussuchen."],
  ["🎮 Game ihrer Wahl","Sie bestimmt, was ihr heute zusammen spielt."],
  ["🎬 Film-/Serienwahl","Sie entscheidet, was ihr gemeinsam schaut."],
  ["☕ Verwöhn-Bonus","Du spendierst ihr ihr Lieblingsgetränk."],
  ["👑 Königin für einen Tag","Sie darf heute eine kleine Entscheidung bestimmen."],
  ["💌 Süße Nachricht","Du musst ihr eine richtig süße Nachricht schreiben."],
  ["🍦 Dessert-Bonus","Sie bekommt ein Dessert ihrer Wahl von dir."],
  ["💎 Mega-Bonus","Sie bekommt einen Bonus ihrer Wahl bis 25 €."]
];
function draw(){
  const cx=450,cy=450,r=425;
  ctx.clearRect(0,0,900,900);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotation);
  for(let i=0;i<n;i++){
    const a=i*arc-Math.PI/2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+arc);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.16)";ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.rotate(a+arc/2);ctx.textAlign="right";ctx.fillStyle="#f5fbff";
    ctx.font="700 16px system-ui";
    let name=personalities[i][0].replace("Die ","");
    if(name.length>17) name=name.slice(0,16)+"…";
    ctx.fillText(name,r-22,6);ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,72,0,Math.PI*2);ctx.fillStyle="#0a101a";ctx.fill();
  ctx.strokeStyle="#8ed8ff";ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle="#dff7ff";ctx.font="800 19px system-ui";ctx.textAlign="center";ctx.fillText("SPIN",0,7);
  ctx.restore();
}
draw();

document.getElementById("spinCount").textContent=spinCount;
const list=document.getElementById("list");
personalities.forEach((p,i)=>{
  const d=document.createElement("div");d.className="person";
  d.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span><span>${p[0]}</span>`;
  list.appendChild(d);
});

function winnerIndex(){
  const normalized=(((-rotation)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  return Math.floor(normalized/arc)%n;
}
document.getElementById("spin").onclick=()=>{
  if(spinning)return;
  spinning=true;
  const btn=document.getElementById("spin");btn.disabled=true;
  document.getElementById("winner").textContent="…";
  document.getElementById("desc").textContent="Das Schicksal entscheidet.";
  const target=Math.floor(Math.random()*n);
  const current=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const targetRot=(Math.PI*2-target*arc-arc/2)+Math.PI*2*5;
  const start=rotation, end=rotation + (targetRot-current);
  const duration=5200, t0=performance.now();
  function anim(now){
    const t=Math.min(1,(now-t0)/duration);
    const eased=1-Math.pow(1-t,4);
    rotation=start+(end-start)*eased; draw();
    if(t<1)requestAnimationFrame(anim);else{
      rotation=end;draw();
      spinCount++;
      localStorage.setItem("personalitySpinCount",spinCount);
      document.getElementById("winner").textContent=personalities[target][0];
      document.getElementById("desc").textContent=personalities[target][1];

      // Jeder 10. Spin löst zusätzlich einen Bonus aus.
      if(spinCount % 10 === 0){
        const bonus=bonuses[(spinCount/10-1)%bonuses.length];
        setTimeout(()=>{
          document.getElementById("winner").textContent="🎉 BONUS! "+bonus[0];
          document.getElementById("desc").textContent=bonus[1]+" (Spin #"+spinCount+")";
        },500);
      }

      spinning=false;btn.disabled=false;
    }
  }
  requestAnimationFrame(anim);
};
</script>
</body>
</html>
